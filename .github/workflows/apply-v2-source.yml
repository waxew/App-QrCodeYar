name: Apply v2 source patch

on:
  push:
    branches: [ complete-v2.0.0 ]
    paths:
      - '.github/patches/v2-*.patch'
      - '.github/workflows/apply-v2-source.yml'

permissions:
  contents: write

concurrency:
  group: apply-v2-source
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4
        with:
          ref: complete-v2.0.0
          fetch-depth: 0

      - name: Apply validated source patches atomically
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t patches < <(find .github/patches -maxdepth 1 -type f -name 'v2-*.patch' | sort)
          test "${#patches[@]}" -gt 0
          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

          rm -rf .github/patches

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Complete App-QrCodeYar v2.0.0 [skip ci]"
          git push origin HEAD:complete-v2.0.0
