# CI اصلی پروژه: هر Push روی main ابتدا Debug و Release را کامپایل می‌کند.
# Release این Workflow عمداً unsigned است؛ کلید خصوصی انتشار نباید داخل GitHub عمومی قرار بگیرد.
name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # سورس همان Commit را روی Runner دریافت می‌کند.
      - name: Checkout source
        uses: actions/checkout@v4

      # پروژه با Java 17 تنظیم شده است.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # چون Gradle Wrapper عمداً در نسخه اولیه وجود ندارد، Gradle ثابت 8.9 نصب می‌شود.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # compileSdk/targetSdk پروژه 35 است.
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Debug برای کنترل سریع نصب تستی و Release برای فایل پابلیش ساخته می‌شود.
      - name: Build debug and unsigned release APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      # ابزار رسمی apksigner و zipalign همراه unsigned APK در Artifact قرار می‌گیرند.
      # امضای نهایی بیرون GitHub و با Release Key خصوصی انجام می‌شود.
      - name: Prepare release signing bundle
        run: |
          mkdir -p /tmp/release-bundle/tools/lib
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/release-bundle/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/release-bundle/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/release-bundle/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/release-bundle/tools/lib/
          chmod +x /tmp/release-bundle/tools/apksigner /tmp/release-bundle/tools/zipalign

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: App-QrCodeYar-v1.0.1-release-bundle
          path: /tmp/release-bundle
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-QrCodeYar-v1.0.1-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
