# CI اصلی پروژه: هر Push روی main ابتدا Debug و Release را کامپایل می‌کند.
# Release در Runner به‌صورت unsigned + zipaligned آماده می‌شود؛ کلید خصوصی Production هرگز وارد GitHub عمومی نمی‌شود.
name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # سورس همان Commit را روی Runner دریافت می‌کند.
      - name: Checkout source
        uses: actions/checkout@v4

      # پروژه با Java 17 تنظیم شده است.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # نسخه Gradle با Android Gradle Plugin پروژه سازگار است.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # compileSdk/targetSdk پروژه 35 است.
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Debug برای تست و Release برای فایل پابلیش کامپایل می‌شوند.
      - name: Build debug and unsigned release APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      # zipalign باید قبل از امضای نهایی انجام شود؛ این کار داخل محیط رسمی Android SDK انجام می‌شود.
      - name: Prepare aligned release signing bundle
        run: |
          mkdir -p /tmp/release-bundle/tools/lib
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/release-bundle/App-QrCodeYar-v1.0.1-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 \
            /tmp/release-bundle/App-QrCodeYar-v1.0.1-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/release-bundle/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/release-bundle/tools/lib/
          chmod +x /tmp/release-bundle/tools/apksigner

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: App-QrCodeYar-v1.0.1-release-bundle
          path: /tmp/release-bundle
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-QrCodeYar-v1.0.1-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
