# CI اصلی پروژه: Push روی main و Pull Requestها را کامپایل می‌کند.
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug and unsigned release APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare aligned release signing bundle
        run: |
          mkdir -p /tmp/release-bundle/tools/lib
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/release-bundle/App-QrCodeYar-v1.9.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 \
            /tmp/release-bundle/App-QrCodeYar-v1.9.0-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/release-bundle/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/release-bundle/tools/lib/
          chmod +x /tmp/release-bundle/tools/apksigner

      - name: Prepare source archive
        run: git archive --format=zip --output=/tmp/App-QrCodeYar-v1.9.0-source-public.zip HEAD

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: App-QrCodeYar-v1.9.0-release-bundle
          path: /tmp/release-bundle
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: App-QrCodeYar-v1.9.0-source-public
          path: /tmp/App-QrCodeYar-v1.9.0-source-public.zip
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-QrCodeYar-v1.9.0-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
