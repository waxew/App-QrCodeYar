name: Apply App-QrCodeYar v1.0.1 Exact

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v101-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          cat \
            .migration/source.b64.00 \
            .migration/source.b64.01 \
            .migration/source.b64.02 \
            .migration/source.b64.03 \
            .migration/source.b64.04 \
            .migration/source.b64.05y0 \
            .migration/source.b64.05y1 \
            .migration/source.b64.05y2 \
            .migration/source.b64.05y3 \
            .migration/source.b64.05x1 \
            .migration/source.b64.05x2 \
            .migration/source.b64.06 \
            .migration/source.b64.07 \
            .migration/source.b64.08 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          unzip -t /tmp/source.zip
          rm -rf /tmp/source-extract
          mkdir -p /tmp/source-extract
          unzip -q -o /tmp/source.zip -d /tmp/source-extract
          cp -a /tmp/source-extract/. .
          rm -rf .migration
          rm -f .github/workflows/bootstrap-v101.yml
          rm -f .github/workflows/apply-v101.yml
          rm -f .github/workflows/apply-v101-fix.yml

      - name: Commit v1.0.1 source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release App-QrCodeYar v1.0.1 source update"
          git push
