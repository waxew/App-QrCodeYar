name: Bootstrap QR Code Yar Source

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source tree
        run: |
          rm -rf /tmp/qrcodeyar-import
          mkdir -p /tmp/qrcodeyar-import
          cat source/source.b64.* > /tmp/qrcodeyar.b64
          base64 -d /tmp/qrcodeyar.b64 > /tmp/qrcodeyar.zip
          unzip -q /tmp/qrcodeyar.zip -d /tmp/qrcodeyar-import
          cp -a /tmp/qrcodeyar-import/qr-barcode-studio/. .

          sed -i 's/com.google.zxing.integration.android.ScanContract/com.journeyapps.barcodescanner.ScanContract/g' app/src/main/java/com/waxew/qrbarcode/ui/QrBarcodeApp.kt
          sed -i 's/com.google.zxing.integration.android.ScanOptions/com.journeyapps.barcodescanner.ScanOptions/g' app/src/main/java/com/waxew/qrbarcode/ui/QrBarcodeApp.kt

          sed -i 's#https://github.com/waxew/Assistant/tree/main/android/qr-barcode-studio#https://github.com/waxew/App-QrCodeYar#g' README.md app/src/main/java/com/waxew/qrbarcode/ui/QrBarcodeApp.kt distribution/latest.json || true
          sed -i 's#https://raw.githubusercontent.com/waxew/Assistant/main/android/qr-barcode-studio/distribution/latest.json#https://raw.githubusercontent.com/waxew/App-QrCodeYar/main/distribution/latest.json#g' app/src/main/java/com/waxew/qrbarcode/update/UpdateChecker.kt

      - name: Commit imported Android project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Import QrCodeYar Android v1.0.0 source'
          git push
