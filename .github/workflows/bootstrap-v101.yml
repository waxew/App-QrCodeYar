name: Bootstrap App-QrCodeYar v1.0.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-v101.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed v1.0.1 source tree
        shell: bash
        run: |
          cat > /tmp/source.b64 <<'EOF'

          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C .
          rm -f .github/workflows/bootstrap-v101.yml

      - name: Commit v1.0.1 source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release App-QrCodeYar v1.0.1 source update"
          git push
