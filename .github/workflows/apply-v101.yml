name: Apply App-QrCodeYar v1.0.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v101.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply reviewed source
        shell: bash
        run: |
          cat .migration/source.b64.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          rm -rf /tmp/source-extract
          mkdir -p /tmp/source-extract
          unzip -q -o /tmp/source.zip -d /tmp/source-extract
          cp -a /tmp/source-extract/. .
          rm -rf .migration
          rm -f .github/workflows/bootstrap-v101.yml
          rm -f .github/workflows/apply-v101.yml

      - name: Commit v1.0.1 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release App-QrCodeYar v1.0.1 source update"
          git push
